<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teams Office Bridge</title>
  <link rel="stylesheet" href="taskpane.css">
  <script defer src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script defer src="editingOperations.js"></script>
  <script defer src="operations.js"></script>
  <script defer src="wordOperations.js"></script>
  <script defer src="taskpane.js"></script>
</head>
<body>
  <main>
    <h1>Teams Office Bridge</h1>
    <p id="status" role="status">Connecting to Office…</p>
    <p id="workbook"></p>
    <p>While this pane is open, local agents connected to Teams can read and update this document.</p>
    <button id="disconnect" type="button" disabled>Disconnect this document</button>
  </main>
</body>
</html>
